{% load static %}

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Mi Blog{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'posts/css/estilos.css' %}">
  </head>
  <body>
    <header class="site-header">
      {% comment %} Logo {% endcomment %}
      <a href="{% url 'inicio' %}" class="logo">
        <img src="{% static 'posts/img/logo-glups.png' %}" alt="Logo de Glups">
      </a>

      {% comment %} Menu {% endcomment %}
      <nav>
        <a href="{% url 'inicio' %}">Inicio</a>
        <a href="{% url 'lista_posts' %}">Posts</a>
        <a href="{% url 'acerca' %}">Acerca de</a>
      </nav>
    </header>

    {% comment %} Contenido {% endcomment %}
    <main>
      {% block content %}{% endblock %}
    </main>

    <footer>
      <p>Creado con Django</p>
    </footer>
  </body>
</html>
